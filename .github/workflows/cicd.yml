name: Nuitka Build CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Nuitka compile
        run: nuitka --standalone --follow-imports main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-build-output
          path: main.dist
