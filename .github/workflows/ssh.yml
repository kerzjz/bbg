name: Auto SSH 24h
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  tmate:
    runs-on: ubuntu-latest
    timeout-minutes: 1430
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 tmate
        run: sudo apt install tmate -y

      - name: 启动 tmate
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          echo "SSH_CMD=$SSH" >> $GITHUB_ENV

      - name: 生成网页
        run: |
          mkdir -p public
          cat > public/index.html << EOF
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SSH 连接</title>
</head>
<body style="font-size:22px; padding:40px;">
    <h2>当前 SSH 命令</h2>
    <code style="color:red; font-size:24px;">${{ env.SSH_CMD }}</code>
    <p>每24小时自动刷新</p>
</body>
</html>
EOF

      - name: 部署到公开Pages仓库
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAT }}
          external_repository: kerzjz/bbgp
          publish_dir: ./public
          publish_branch: gh-pages
          allow_empty_commit: true

      - name: 保持运行24h
        run: sleep 1430m
